plugins {
    id "com.android.application"
}

import java.util.Properties

def releaseSigningPropertiesPath = System.getenv("SM64_RELEASE_KEYSTORE_PROPERTIES")
def releaseSigningPropertiesFile = releaseSigningPropertiesPath
    ? file(releaseSigningPropertiesPath)
    : rootProject.file("keystore.properties")
def releaseSigningProperties = new Properties()
def releaseSigningAvailable = releaseSigningPropertiesFile.exists()
if (releaseSigningAvailable) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def generatedResourceAssets = layout.buildDirectory.dir("generated/sm64Resources/assets")

tasks.register("syncSm64ResourceAssets", Sync) {
    from("../../../lang") {
        into("lang")
    }
    from("../../../palettes") {
        into("palettes")
    }
    from("../../../mods") {
        into("mods")
    }
    from("../../../sonic_shoes") {
        into("sonic_shoes")
    }
    into(generatedResourceAssets)
}

android {
    namespace "com.fulldivegames.sm64coopdxvr"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.fulldivegames.sm64coopdxvr"
        minSdk 26
        targetSdk 32
        versionCode providers.gradleProperty("SM64_VERSION_CODE").get().toInteger()
        versionName providers.gradleProperty("SM64_VERSION_NAME").get()

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "sm64coopdxvr"
            }
        }
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseSigningProperties.getProperty("storeFile"))
                storePassword releaseSigningProperties.getProperty("storePassword")
                keyAlias releaseSigningProperties.getProperty("keyAlias")
                keyPassword releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main.assets.srcDir(generatedResourceAssets)
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncSm64ResourceAssets")
}

tasks.configureEach { task ->
    if (task.name == "packageRelease") {
        task.doFirst {
            if (!releaseSigningAvailable) {
                throw new GradleException(
                    "Release signing is not configured. Set SM64_RELEASE_KEYSTORE_PROPERTIES " +
                    "or create platform/android/keystore.properties.")
            }
        }
    }
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.60"
}
